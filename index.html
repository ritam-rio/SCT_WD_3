<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tic-Tac-Toe</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="msg-container hide">

        <div class="popup">

            <i class="fa-solid fa-trophy trophy"></i>

            <h2 id="msg">
                Congratulations!
            </h2>

            <button id="new-btn">
                <i class="fa-solid fa-rotate-right"></i>
                New Game
            </button>

        </div>

    </div>
    <main>

        <header>

            <h1>
                <i class="fa-solid fa-gamepad"></i>
                Tic Tac Toe
            </h1>

           <p class="subtitle" id="status">
    Player O's Turn
</p>

        </header>
        <div class="game-mode">

    <button id="pvp-btn" class="mode-btn active">
        <i class="fa-solid fa-users"></i>
        Player vs Player
    </button>

    <button id="ai-btn" class="mode-btn">
        <i class="fa-solid fa-robot"></i>
        Player vs Computer
    </button>

</div>
<div class="difficulty hide" id="difficulty">

    <button id="medium-btn" class="difficulty-btn active">
        Medium
    </button>

    <button id="hard-btn" class="difficulty-btn">
        Hard
    </button>

</div>
        <section class="game-section">

            <div class="container">

                <div class="game">

                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>

                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>

                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>

                </div>

            </div>

        </section>

        <div class="controls">

            <button id="reset-btn">
                <i class="fa-solid fa-arrows-rotate"></i>
                Reset Game
            </button>

        </div>

    </main>
    <script src="script.js"></script>

</body>
</html>
